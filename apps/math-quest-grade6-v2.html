<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Quest: Grade 6 Academy</title>
<style>
  :root {
    --bg: #EDF3FC;
    --card: #FFFFFF;
    --ink: #22304A;
    --muted: #6B7A94;
    --purple: #6C4FE0;
    --orange: #FF9F1C;
    --green: #23B26D;
    --red: #F45B69;
    --line: #DCE5F2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    min-height: 100vh;
    min-height: 100dvh;
  }
  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    border: none;
    background: none;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 10px 12px 20px;
  }

  /* header + HUD */
  header { display: flex; align-items: center; gap: 8px; padding: 4px 2px 8px; }
  header h1 { font-size: 20px; font-weight: 800; flex: 1; }
  #muteBtn {
    font-size: 20px; width: 42px; height: 42px;
    background: var(--card); border-radius: 12px; border: 2px solid var(--line);
  }
  .hud {
    background: var(--card); border-radius: 16px; border: 2px solid var(--line);
    padding: 10px 12px; display: flex; align-items: center; gap: 10px;
  }
  #rankChip {
    background: var(--purple); color: #fff; font-weight: 800; font-size: 13px;
    padding: 6px 10px; border-radius: 999px; white-space: nowrap;
  }
  .xpwrap { flex: 1; min-width: 0; }
  .xpbar { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
  #xpFill { height: 100%; width: 0%; background: var(--orange); border-radius: 999px; transition: width 0.4s; }
  #xpText { font-size: 11px; color: var(--muted); margin-top: 3px; font-weight: 600; }
  #streakChip { font-weight: 800; font-size: 15px; white-space: nowrap; }

  /* tabs */
  .tabs { display: flex; gap: 6px; margin: 10px 0; }
  .tab {
    flex: 1; padding: 10px 0; border-radius: 12px; font-weight: 800; font-size: 14px;
    background: var(--card); border: 2px solid var(--line); color: var(--muted);
  }
  .tab[aria-selected="true"] { background: var(--purple); border-color: var(--purple); color: #fff; }

  /* question card */
  .qcard {
    background: var(--card); border: 2px solid var(--line); border-radius: 20px;
    padding: 14px;
  }
  #diagram svg { width: 100%; height: auto; display: block; }
  #qtext { font-size: 18px; font-weight: 700; margin: 10px 2px; line-height: 1.45; }
  #answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ans {
    min-height: 60px; border-radius: 14px; border: 2px solid var(--line);
    background: #F7FAFF; font-size: 20px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px;
  }
  .ans:not(:disabled):active { transform: scale(0.96); }
  .ans.correct { background: #E4F8EE; border-color: var(--green); }
  .ans.wrong { background: #FDE9EB; border-color: var(--red); }
  .ans .mark { font-size: 18px; }
  #feedback {
    margin-top: 10px; border-radius: 14px; padding: 10px 12px;
    font-size: 15px; font-weight: 600; line-height: 1.5; display: none;
  }
  #feedback.good { display: block; background: #E4F8EE; color: #14663C; }
  #feedback.bad { display: block; background: #FDE9EB; color: #8C2430; }

  /* fractions */
  .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 2px; line-height: 1.1; }
  .frac .top { border-bottom: 2px solid currentColor; padding: 0 5px 1px; }
  .frac .bot { padding: 1px 5px 0; }
  .mixed { display: inline-flex; align-items: center; gap: 3px; }

  /* footer buttons */
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button {
    flex: 1; padding: 12px 0; border-radius: 14px; font-weight: 800; font-size: 15px;
  }
  #teachBtn { background: #FFF1DC; border: 2px solid var(--orange); color: #8A5200; }
  #skipBtn { background: var(--card); border: 2px solid var(--line); color: var(--muted); }
  #prizeMeter { text-align: center; color: var(--muted); font-size: 13px; font-weight: 700; margin-top: 10px; }
  #prizeMeter .dots { letter-spacing: 4px; font-size: 15px; }

  /* overlays */
  .overlay {
    position: fixed; inset: 0; background: rgba(24, 32, 52, 0.55);
    display: none; align-items: flex-end; justify-content: center; z-index: 10;
    padding: 0;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--card); width: 100%; max-width: 480px;
    border-radius: 22px 22px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    max-height: 92vh; max-height: 92dvh; overflow-y: auto;
  }
  @media (min-width: 500px) {
    .overlay { align-items: center; padding: 20px; }
    .sheet { border-radius: 22px; }
  }
  .sheet h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }

  /* lesson */
  #lessonArt svg { width: 100%; height: auto; display: block; }
  #lessonCaption { font-size: 17px; font-weight: 700; line-height: 1.5; min-height: 4.2em; margin: 10px 2px; }
  .lessonNav { display: flex; gap: 8px; align-items: center; }
  .lessonNav button {
    padding: 12px 16px; border-radius: 14px; font-weight: 800; font-size: 16px;
    background: #F1EDFD; border: 2px solid var(--purple); color: var(--purple);
  }
  .lessonNav button:disabled { opacity: 0.35; }
  #lessonNext { flex: 1; background: var(--purple); color: #fff; }
  #lessonDots { text-align: center; color: var(--muted); font-weight: 700; font-size: 13px; margin-top: 10px; }

  /* prize */
  #prizeSheet { text-align: center; }
  #prizeSheet .big { font-size: 46px; }
  #prizeSheet p { color: var(--muted); font-weight: 700; margin: 6px 0 14px; }
  .gameCards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gameCard {
    border: 2px solid var(--line); border-radius: 16px; padding: 14px 8px;
    background: #F7FAFF; display: flex; flex-direction: column; gap: 4px; align-items: center;
  }
  .gameCard .icon { font-size: 34px; }
  .gameCard .name { font-weight: 800; font-size: 16px; }
  .gameCard .best { font-size: 12px; color: var(--muted); font-weight: 700; }
  .backLink { margin-top: 12px; color: var(--muted); font-weight: 800; padding: 10px; width: 100%; }

  /* mini-game shared */
  .gameTop { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .gameTop h2 { flex: 1; margin: 0; }
  .gameTop .stat { font-weight: 800; font-size: 14px; color: var(--muted); }
  .backBtn {
    background: #F1EDFD; border: 2px solid var(--purple); color: var(--purple);
    font-weight: 800; font-size: 13px; padding: 8px 12px; border-radius: 12px;
  }
  .gameOverBox {
    text-align: center; padding: 14px; border: 2px solid var(--line);
    border-radius: 16px; margin-top: 10px; display: none;
  }
  .gameOverBox.show { display: block; }
  .gameOverBox .headline { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .gameOverBox .sub { color: var(--muted); font-weight: 700; font-size: 14px; margin-bottom: 10px; }
  .bigBackBtn {
    background: var(--purple); color: #fff; font-weight: 800; font-size: 16px;
    padding: 12px 18px; border-radius: 14px; width: 100%;
  }

  /* snake */
  #snakeCanvas {
    width: 100%; max-width: 320px; margin: 0 auto; display: block;
    background: #E7F6E9; border-radius: 14px; border: 2px solid var(--line);
    touch-action: none;
  }
  .dpad { display: grid; grid-template-columns: repeat(3, 64px); justify-content: center; gap: 6px; margin-top: 10px; }
  .dpad button {
    height: 48px; border-radius: 12px; background: #F1EDFD; border: 2px solid var(--purple);
    font-size: 20px; color: var(--purple);
  }
  .dpad .blank { visibility: hidden; }

  /* penalty kicks */
  #soccerCanvas {
    width: 100%; max-width: 320px; margin: 0 auto; display: block;
    border-radius: 14px; border: 2px solid var(--line); background: #8FD05E;
    touch-action: none;
  }
  .aimRow { display: flex; gap: 8px; margin-top: 10px; }
  .aimRow button {
    flex: 1; padding: 12px 0; border-radius: 12px;
    background: #F1EDFD; border: 2px solid var(--purple); color: var(--purple);
    font-weight: 800; font-size: 15px;
  }
  .aimRow button:active { transform: scale(0.95); }
  #soccerHint { text-align: center; color: var(--muted); font-size: 13px; font-weight: 700; margin-top: 8px; }

  /* confetti */
  .confetti {
    position: fixed; top: -30px; font-size: 24px; z-index: 30; pointer-events: none;
    animation: fall 1.4s ease-in forwards;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(360deg); opacity: 0.6; }
  }
  @keyframes wiggle {
    0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); }
  }
  .qcard.party { animation: wiggle 0.4s; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .confetti, .qcard.party { animation: none; }
    .ans:not(:disabled):active { transform: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>🎓 Math Quest</h1>
    <button id="muteBtn" aria-label="Mute sounds" aria-pressed="false">🔊</button>
  </header>

  <div class="hud">
    <span id="rankChip">Cadet</span>
    <div class="xpwrap">
      <div class="xpbar"><div id="xpFill"></div></div>
      <div id="xpText">0 XP</div>
    </div>
    <span id="streakChip">🔥 0</span>
  </div>

  <div class="tabs" role="tablist" aria-label="Topic">
    <button class="tab" role="tab" data-topic="mixed" aria-selected="true">🎲 Mixed</button>
    <button class="tab" role="tab" data-topic="fractions" aria-selected="false">🍫 Fractions</button>
    <button class="tab" role="tab" data-topic="shapes" aria-selected="false">📐 Shapes</button>
  </div>

  <div class="qcard" id="qcard">
    <div id="diagram"></div>
    <div id="qtext"></div>
    <div id="answers"></div>
    <div id="feedback"></div>
  </div>

  <div class="actions">
    <button id="teachBtn">📖 Teach me this!</button>
    <button id="skipBtn">⏭️ New question</button>
  </div>
  <div id="prizeMeter"></div>

  <div class="sr" aria-live="polite" id="announcer"></div>
</main>

<!-- lesson overlay -->
<div class="overlay" id="lessonOverlay" role="dialog" aria-modal="true" aria-label="Lesson">
  <div class="sheet">
    <h2 id="lessonTitle"></h2>
    <div id="lessonArt"></div>
    <div id="lessonCaption"></div>
    <div class="lessonNav">
      <button id="lessonPrev" aria-label="Previous step">⬅️</button>
      <button id="lessonNext">Next ➡️</button>
    </div>
    <div id="lessonDots"></div>
  </div>
</div>

<!-- prize overlay -->
<div class="overlay" id="prizeOverlay" role="dialog" aria-modal="true" aria-label="Prize time">
  <div class="sheet" id="prizeSheet">
    <div class="big">🎁</div>
    <h2>Prize time!</h2>
    <p>Five more questions done — pick a game!</p>
    <div class="gameCards">
      <button class="gameCard" id="pickSnake">
        <span class="icon">🐍</span>
        <span class="name">Snake</span>
        <span class="best" id="snakeBest">Best: —</span>
      </button>
      <button class="gameCard" id="pickSoccer">
        <span class="icon">⚽</span>
        <span class="name">Penalty Kicks</span>
        <span class="best" id="soccerBest">Best: —</span>
      </button>
    </div>
    <button class="backLink" id="prizeSkip">No thanks, back to the quest</button>
  </div>
</div>

<!-- snake overlay -->
<div class="overlay" id="snakeOverlay" role="dialog" aria-modal="true" aria-label="Snake">
  <div class="sheet">
    <div class="gameTop">
      <h2>🐍 Snake</h2>
      <span class="stat" id="snakeStat">🍎 0 · ⏱ 45</span>
      <button class="backBtn" data-close="snake">Back to the quest</button>
    </div>
    <canvas id="snakeCanvas" width="320" height="320"></canvas>
    <div class="dpad">
      <span class="blank"></span><button data-dir="up" aria-label="Up">⬆️</button><span class="blank"></span>
      <button data-dir="left" aria-label="Left">⬅️</button><button data-dir="down" aria-label="Down">⬇️</button><button data-dir="right" aria-label="Right">➡️</button>
    </div>
    <div class="gameOverBox" id="snakeOver">
      <div class="headline" id="snakeOverHead"></div>
      <div class="sub" id="snakeOverSub"></div>
      <button class="bigBackBtn" data-close="snake">Back to the quest 🚀</button>
    </div>
  </div>
</div>

<!-- penalty kicks overlay -->
<div class="overlay" id="soccerOverlay" role="dialog" aria-modal="true" aria-label="Penalty Kicks">
  <div class="sheet">
    <div class="gameTop">
      <h2>⚽ Penalty Kicks</h2>
      <span class="stat" id="soccerStat">shot 1 of 5</span>
      <button class="backBtn" data-close="soccer">Back to the quest</button>
    </div>
    <canvas id="soccerCanvas" width="320" height="250" aria-label="Penalty shootout pitch"></canvas>
    <div class="aimRow">
      <button data-aim="0">↖ Left</button>
      <button data-aim="1">⬆ Middle</button>
      <button data-aim="2">↗ Right</button>
    </div>
    <div id="soccerHint">Tap a corner or flick the ball — don't let the goalie guess your spot!</div>
    <div class="gameOverBox" id="soccerOver">
      <div class="headline" id="soccerOverHead"></div>
      <div class="sub" id="soccerOverSub"></div>
      <button class="bigBackBtn" data-close="soccer">Back to the quest 🚀</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function ri(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* ---------- sound (all synthesized, kept mild) ---------- */
  var audio = { ctx: null, master: null, muted: false };
  function ac() {
    if (!audio.ctx) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      audio.ctx = new C();
      audio.master = audio.ctx.createGain();
      audio.master.gain.value = 0.13; /* mild on purpose */
      audio.master.connect(audio.ctx.destination);
    }
    if (audio.ctx.state === "suspended") audio.ctx.resume();
    return audio.ctx;
  }
  function tone(type, f0, f1, t0, dur, vol) {
    if (audio.muted) return;
    var c = ac(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain();
    var start = c.currentTime + t0;
    o.type = type;
    o.frequency.setValueAtTime(f0, start);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), start + dur);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol || 0.5, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(audio.master);
    o.start(start); o.stop(start + dur + 0.05);
  }
  function noise(t0, dur, cutoff, vol) {
    if (audio.muted) return;
    var c = ac(); if (!c) return;
    var len = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = c.createBufferSource(); src.buffer = buf;
    var f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff;
    var g = c.createGain(); g.gain.value = vol || 0.4;
    src.connect(f); f.connect(g); g.connect(audio.master);
    src.start(c.currentTime + t0);
  }
  var sfx = {
    fart: function () { tone("sawtooth", 95, 55, 0, 0.45, 0.7); tone("sawtooth", 70, 48, 0.06, 0.4, 0.5); noise(0, 0.35, 300, 0.35); },
    boing: function () { tone("sine", 420, 130, 0, 0.12, 0.6); tone("sine", 130, 340, 0.12, 0.12, 0.5); tone("sine", 340, 170, 0.24, 0.18, 0.4); },
    trombone: function () { [233, 220, 208, 185].forEach(function (f, i) { tone("sawtooth", f, f * 0.97, i * 0.22, 0.22, 0.4); }); },
    whistle: function () { tone("sine", 1400, 350, 0, 0.5, 0.35); },
    splat: function () { noise(0, 0.25, 500, 0.6); tone("sine", 160, 60, 0, 0.2, 0.5); },
    honk: function () { tone("square", 233, 233, 0, 0.14, 0.35); tone("square", 220, 220, 0.18, 0.22, 0.35); },
    coin: function () { tone("square", 988, 988, 0, 0.08, 0.3); tone("square", 1319, 1319, 0.08, 0.18, 0.3); },
    sparkle: function () { [1047, 1319, 1568, 2093].forEach(function (f, i) { tone("sine", f, f, i * 0.06, 0.14, 0.25); }); },
    fanfare: function () { [523, 659, 784].forEach(function (f, i) { tone("square", f, f, i * 0.09, 0.16, 0.25); }); tone("square", 1047, 1047, 0.3, 0.3, 0.3); },
    cheer: function () { tone("sawtooth", 300, 900, 0, 0.4, 0.3); tone("sine", 600, 1200, 0.1, 0.35, 0.25); },
    bigwin: function () { sfx.fanfare(); sfx.sparkle(); tone("sine", 1568, 2093, 0.45, 0.3, 0.25); },
    blip: function () { tone("square", 660, 880, 0, 0.07, 0.25); },
    thump: function () { tone("sine", 150, 50, 0, 0.12, 0.55); noise(0, 0.08, 400, 0.25); },
    crash: function () { tone("sawtooth", 220, 60, 0, 0.35, 0.4); noise(0, 0.3, 600, 0.4); }
  };
  var rightSounds = ["coin", "sparkle", "fanfare", "cheer"];
  function wrongNoise() {
    sfx.fart();
    if (Math.random() < 0.4) {
      setTimeout(function () { sfx[pick(["boing", "trombone", "whistle", "splat", "honk"])](); }, 380);
    }
  }

  $("muteBtn").addEventListener("click", function () {
    audio.muted = !audio.muted;
    this.textContent = audio.muted ? "🔇" : "🔊";
    this.setAttribute("aria-pressed", String(audio.muted));
    this.setAttribute("aria-label", audio.muted ? "Unmute sounds" : "Mute sounds");
  });

  /* ---------- fraction helpers ---------- */
  function gcd(a, b) { while (b) { var t = b; b = a % b; a = t; } return a; }
  function simp(n, d) { var g = gcd(n, d); return [n / g, d / g]; }
  function key(n, d) { var s = simp(n, d); return "f" + s[0] + "/" + s[1]; }
  function stackHTML(n, d) {
    return '<span class="frac"><span class="top">' + n + '</span><span class="bot">' + d + "</span></span>";
  }
  function fracHTML(n, d, raw) {
    if (d === 1) return "<b>" + n + "</b>";
    if (raw) return stackHTML(n, d);
    if (n % d === 0) return "<b>" + n / d + "</b>";
    if (n > d) {
      var w = Math.floor(n / d);
      return '<span class="mixed"><b>' + w + "</b>" + stackHTML(n - w * d, d) + "</span>";
    }
    return stackHTML(n, d);
  }
  function fracText(n, d) {
    if (d === 1) return String(n);
    if (n % d === 0) return String(n / d);
    if (n > d) return Math.floor(n / d) + " and " + (n % d) + "/" + d;
    return n + "/" + d;
  }

  /* ---------- SVG builders ---------- */
  var SVG_W = 320, SVG_H = 150;
  function svgWrap(inner, h) {
    return '<svg viewBox="0 0 ' + SVG_W + " " + (h || SVG_H) + '" role="img" aria-hidden="true">' + inner + "</svg>";
  }
  function barSVG(x, y, w, h, pieces, shaded, fill) {
    var out = "", pw = w / pieces;
    for (var i = 0; i < pieces; i++) {
      out += '<rect x="' + (x + i * pw) + '" y="' + y + '" width="' + pw + '" height="' + h +
        '" rx="3" fill="' + (i < shaded ? fill : "#F3EBE3") + '" stroke="#8A5A33" stroke-width="2"/>';
    }
    return out;
  }
  function label(x, y, text, size, color) {
    return '<text x="' + x + '" y="' + y + '" font-size="' + (size || 15) + '" font-weight="700" fill="' +
      (color || "#22304A") + '" text-anchor="middle" font-family="sans-serif">' + text + "</text>";
  }
  function pizzaSVG(cx, cy, r, den, num, fill) {
    var out = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#FBE7C0" stroke="#C98A2D" stroke-width="3"/>';
    for (var i = 0; i < den; i++) {
      var a0 = (i / den) * 2 * Math.PI - Math.PI / 2;
      var a1 = ((i + 1) / den) * 2 * Math.PI - Math.PI / 2;
      var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
      var x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      if (i < num) {
        out += '<path d="M' + cx + " " + cy + " L" + x0.toFixed(1) + " " + y0.toFixed(1) +

    });
    var fb = $("feedback");
    fb.className = ""; fb.textContent = "";
    renderHUD();
    if (!state.seen[state.q.lesson]) {
      state.seen[state.q.lesson] = true;
      openLesson(state.q.lesson);
    }
  }

  function confetti() {
    if (reduceMotion) return;
    var emo = ["🎉", "⭐", "✨", "🎊", "🌟"];
    for (var i = 0; i < 18; i++) {
      var s = document.createElement("span");
      s.className = "confetti";
      s.textContent = pick(emo);
      s.style.left = ri(2, 95) + "vw";
      s.style.animationDelay = (Math.random() * 0.3) + "s";
      document.body.appendChild(s);
      setTimeout(function (el) { return function () { el.remove(); }; }(s), 1900);
    }
  }

  function answer(i, btn) {
    if (state.locked) return;
    state.locked = true;
    var q = state.q, correctIdx = -1;
    q.answers.forEach(function (a, j) { if (a.correct) correctIdx = j; });
    var buttons = $("answers").children;
    for (var j = 0; j < buttons.length; j++) buttons[j].disabled = true;
    var fb = $("feedback");
    var right = q.answers[i].correct;
    state.answered++;
    if (state.answered % 5 === 0) state.prizeDue = true;

    buttons[correctIdx].classList.add("correct");
    buttons[correctIdx].insertAdjacentHTML("beforeend", '<span class="mark">✅</span>');

    var delay;
    if (right) {
      state.streak++;
      state.solved++;
      var gain = 10 + 2 * (state.streak - 1);
      state.xp += gain;
      var big = state.streak % 3 === 0;
      if (big) { sfx.bigwin(); confetti(); $("qcard").classList.remove("party"); void $("qcard").offsetWidth; $("qcard").classList.add("party"); }
      else sfx[pick(rightSounds)]();
      fb.className = "good";
      fb.textContent = (big ? "🎉 " + state.streak + " in a row! Amazing! " : "⭐ Correct! ") + "+" + gain + " XP";
      $("announcer").textContent = "Correct! Plus " + gain + " XP. Streak " + state.streak + ".";
      delay = big ? 2200 : 1500;
    } else {
      state.streak = 0;
      btn.classList.add("wrong");
      btn.insertAdjacentHTML("beforeend", '<span class="mark">❌</span>');
      wrongNoise();
      fb.className = "bad";
      fb.innerHTML = "😅 Not quite! " + q.explain;
      $("announcer").textContent = "Not quite. " + q.explain;
      delay = 4200;
    }
    renderHUD();
    state.advanceTimer = setTimeout(nextStep, delay);
  }

  function nextStep() {
    if (lessonOpen()) { state.advanceTimer = setTimeout(nextStep, 500); return; }
    if (state.prizeDue) { state.prizeDue = false; openPrize(); return; }
    loadQuestion();
  }

  /* tabs */
  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () {
      document.querySelectorAll(".tab").forEach(function (x) { x.setAttribute("aria-selected", "false"); });
      t.setAttribute("aria-selected", "true");
      state.topic = t.dataset.topic;
      state.lastType = null;
      state.bag = null;
      loadQuestion();
    });
  });
  $("skipBtn").addEventListener("click", function () { if (!state.locked) loadQuestion(); });
  $("teachBtn").addEventListener("click", function () { openLesson(state.q.lesson); });

  /* ---------- lesson overlay ---------- */
  var lesson = { key: null, step: 0 };
  function lessonOpen() { return $("lessonOverlay").classList.contains("open"); }
  function openLesson(k) {
    lesson.key = k; lesson.step = 0;
    $("lessonTitle").textContent = LESSONS[k].title;
    renderLesson();
    $("lessonOverlay").classList.add("open");
  }
  function renderLesson() {
    var L = LESSONS[lesson.key], s = L.steps[lesson.step];
    $("lessonArt").innerHTML = s.svg;
    $("lessonCaption").textContent = s.cap;
    $("lessonPrev").disabled = lesson.step === 0;
    $("lessonNext").textContent = lesson.step === L.steps.length - 1 ? "Got it! 👍" : "Next ➡️";
    $("lessonDots").textContent = "Step " + (lesson.step + 1) + " of " + L.steps.length;
  }
  $("lessonPrev").addEventListener("click", function () { if (lesson.step > 0) { lesson.step--; renderLesson(); } });
  $("lessonNext").addEventListener("click", function () {
    var L = LESSONS[lesson.key];
    if (lesson.step < L.steps.length - 1) { lesson.step++; renderLesson(); sfx.blip(); }
    else $("lessonOverlay").classList.remove("open");
  });

  /* ---------- prize ---------- */
  function openPrize() {
    sfx.fanfare(); confetti();
    $("snakeBest").textContent = state.best.snake === null ? "First try!" : "Best: 🍎 " + state.best.snake;
    $("soccerBest").textContent = state.best.soccer === null ? "First try!" : "Best: ⚽ " + state.best.soccer + "/5";
    $("prizeOverlay").classList.add("open");
  }
  function closePrizeToQuest() {
    $("prizeOverlay").classList.remove("open");
    loadQuestion();
  }
  $("prizeSkip").addEventListener("click", closePrizeToQuest);
  $("pickSnake").addEventListener("click", function () { $("prizeOverlay").classList.remove("open"); startSnake(); });
  $("pickSoccer").addEventListener("click", function () { $("prizeOverlay").classList.remove("open"); startSoccer(); });

  function questReminder() {
    var r = rankInfo();
    return "Your quest is waiting — 🔥 streak " + state.streak + ", rank " + r.name + "!";
  }
  document.querySelectorAll("[data-close]").forEach(function (b) {
    b.addEventListener("click", function () {
      if (b.dataset.close === "snake") stopSnake(); else stopSoccer();
      $(b.dataset.close + "Overlay").classList.remove("open");
      loadQuestion();
    });
  });

  /* ---------- snake ---------- */
  /* Fixed-step logic + requestAnimationFrame rendering with interpolation, so
     movement glides between cells instead of jumping once per tick. */
  var snake = { timer: null, raf: null, alive: false };
  function recordSnakeBest() {
    if (snake.score > 0 && (state.best.snake === null || snake.score > state.best.snake)) {
      state.best.snake = snake.score;
      return true;
    }
    return false;
  }
  function startSnake() {
    var G = 16, CELL = 20, SIZE = G * CELL;
    var cv = $("snakeCanvas"), c = cv.getContext("2d");
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = SIZE * dpr; cv.height = SIZE * dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    snake.body = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
    snake.prev = snake.body.map(function (s) { return { x: s.x, y: s.y }; });
    snake.dir = { x: 1, y: 0 };
    snake.nextDir = snake.dir;
    snake.score = 0; snake.time = 45; snake.alive = true; snake.wasBest = false;
    var tickMs = 150;
    placeFood();
    $("snakeOver").classList.remove("show");
    $("snakeOverlay").classList.add("open");
    updateStat();
    draw(0);
    var last = null, acc = 0;
    function frame(now) {
      if (!snake.alive) return;
      if (last !== null) acc += Math.min(200, now - last);
      last = now;
      while (acc >= tickMs && snake.alive) { step(); acc -= tickMs; }
      if (!snake.alive) return;
      draw(Math.min(1, acc / tickMs));
      snake.raf = requestAnimationFrame(frame);
    }
    snake.raf = requestAnimationFrame(frame);
    snake.timer = setInterval(function () {
      snake.time--; updateStat();
      if (snake.time <= 0) endSnake("⏱ Time's up!");
    }, 1000);

    function placeFood() {
      do {
        snake.food = { x: ri(0, G - 1), y: ri(0, G - 1) };
      } while (snake.body.some(function (s) { return s.x === snake.food.x && s.y === snake.food.y; }));
    }
    function updateStat() { $("snakeStat").textContent = "🍎 " + snake.score + " · ⏱ " + snake.time; }
    function step() {
      snake.dir = snake.nextDir;
      snake.prev = snake.body.map(function (s) { return { x: s.x, y: s.y }; });
      var h = { x: (snake.body[0].x + snake.dir.x + G) % G, y: (snake.body[0].y + snake.dir.y + G) % G };
      if (snake.body.some(function (s) { return s.x === h.x && s.y === h.y; })) { endSnake("💥 Bumped yourself!"); return; }
      snake.body.unshift(h);
      if (h.x === snake.food.x && h.y === snake.food.y) {
        snake.score++; sfx.coin(); placeFood(); updateStat();
        tickMs = Math.max(95, 150 - snake.score * 3); /* gets a little zippier per apple */
      } else snake.body.pop();
    }
    function pos(i, t) {
      var cur = snake.body[i];
      var prev = snake.prev[Math.min(i, snake.prev.length - 1)] || cur;
      var dx = cur.x - prev.x, dy = cur.y - prev.y;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) return cur; /* wrapped the edge: snap */
      return { x: prev.x + dx * t, y: prev.y + dy * t };
    }
    function draw(t) {
      c.clearRect(0, 0, SIZE, SIZE);
      c.font = "18px sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
      c.fillText("🍎", snake.food.x * CELL + 10, snake.food.y * CELL + 11);
      for (var i = snake.body.length - 1; i >= 0; i--) {
        var p = pos(i, t);
        c.fillStyle = i === 0 ? "#2E7D32" : "#4CAF50";
        if (c.roundRect) {
          c.beginPath();
          c.roundRect(p.x * CELL + 1, p.y * CELL + 1, CELL - 2, CELL - 2, 6);
          c.fill();
        } else {
          c.fillRect(p.x * CELL + 1, p.y * CELL + 1, CELL - 2, CELL - 2);
        }
      }
      var hp = pos(0, t);
      c.fillStyle = "#fff";
      c.beginPath(); c.arc(hp.x * CELL + 7 + snake.dir.x * 3, hp.y * CELL + 7 + snake.dir.y * 3, 2.4, 0, 7); c.fill();
      c.beginPath(); c.arc(hp.x * CELL + 13 + snake.dir.x * 3, hp.y * CELL + 13 + snake.dir.y * 3, 2.4, 0, 7); c.fill();
    }
  }
  function setDir(name) {
    if (!snake.alive) return;
    var d = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } }[name];
    if (d.x === -snake.dir.x && d.y === -snake.dir.y) return;
    snake.nextDir = d;
  }
  document.querySelectorAll(".dpad [data-dir]").forEach(function (b) {
    b.addEventListener("click", function () { setDir(b.dataset.dir); });
  });
  (function () {
    var sx, sy;
    var cv = $("snakeCanvas");
    cv.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; e.preventDefault(); }, { passive: false });
    cv.addEventListener("touchend", function (e) {
      var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
      setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    });
  })();
  document.addEventListener("keydown", function (e) {
    if (!$("snakeOverlay").classList.contains("open")) return;
    var m = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
    if (m) { e.preventDefault(); setDir(m); }
  });
  function stopSnake() {
    clearInterval(snake.timer);
    if (snake.raf) cancelAnimationFrame(snake.raf);
    if (snake.alive) {
      snake.alive = false;
      snake.wasBest = recordSnakeBest(); /* early exit still keeps a record run */
    }
  }
  function endSnake(reason) {
    stopSnake();
    if (reason.indexOf("💥") === 0) sfx.crash(); else sfx.fanfare();
    $("snakeOverHead").textContent = reason + " 🍎 " + snake.score;
    $("snakeOverSub").textContent = (snake.wasBest ? "🏆 New high score! " : "High score: 🍎 " + (state.best.snake === null ? 0 : state.best.snake) + ". ") + questReminder();
    $("snakeOver").classList.add("show");
  }

  /* ---------- penalty kicks ---------- */
  var soccer = { raf: null, wait: null, playing: false, phase: "idle" };
  var SOC = { W: 320, H: 250, zonesX: [80, 160, 240], goalY: 92, ballX: 160, ballY: 210, keeperHome: 160 };
  function recordSoccerBest() {
    if (soccer.goals > 0 && (state.best.soccer === null || soccer.goals > state.best.soccer)) {
      state.best.soccer = soccer.goals;
      return true;
    }
    return false;
  }
  function startSoccer() {
    var cv = $("soccerCanvas");
    soccer.c = cv.getContext("2d");
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = SOC.W * dpr; cv.height = SOC.H * dpr;
    soccer.c.setTransform(dpr, 0, 0, dpr, 0, 0);
    soccer.shot = 0; soccer.goals = 0; soccer.playing = true; soccer.phase = "aim";
    soccer.lastZone = -1; soccer.wasBest = false; soccer.msg = "";
    soccer.keeperX = SOC.keeperHome;
    soccer.ball = { x: SOC.ballX, y: SOC.ballY };
    $("soccerOver").classList.remove("show");
    $("soccerOverlay").classList.add("open");
    sfx.whistle();
    soccerStat();
    soccerDraw();
  }
  function soccerStat() {
    $("soccerStat").textContent = "⚽ " + soccer.goals + " · shot " + Math.min(soccer.shot + 1, 5) + " of 5";
  }
  function soccerDraw() {
    var c = soccer.c;
    if (!c) return;
    /* grass stripes */
    c.fillStyle = "#8FD05E"; c.fillRect(0, 0, SOC.W, SOC.H);
    c.fillStyle = "#7EC24F";
    for (var y = 0; y < SOC.H; y += 56) c.fillRect(0, y, SOC.W, 28);
    /* net */
    c.strokeStyle = "rgba(255,255,255,0.45)"; c.lineWidth = 1;
    for (var nx = 48; nx <= 272; nx += 16) { c.beginPath(); c.moveTo(nx, 46); c.lineTo(nx, 148); c.stroke(); }
    for (var ny = 56; ny <= 148; ny += 16) { c.beginPath(); c.moveTo(46, ny); c.lineTo(274, ny); c.stroke(); }
    /* posts */
    c.strokeStyle = "#FFFFFF"; c.lineWidth = 6; c.lineCap = "round";
    c.beginPath(); c.moveTo(45, 150); c.lineTo(45, 45); c.lineTo(275, 45); c.lineTo(275, 150); c.stroke();
    /* penalty spot */
    c.fillStyle = "rgba(255,255,255,0.6)";
    c.beginPath(); c.ellipse(SOC.ballX, SOC.ballY + 12, 16, 4, 0, 0, 7); c.fill();
    /* keeper */
    var kx = soccer.keeperX;
    c.strokeStyle = "#FF8A3C"; c.lineWidth = 6;
    c.beginPath(); c.moveTo(kx - 9, 122); c.lineTo(kx - 21, 106); c.stroke();
    c.beginPath(); c.moveTo(kx + 9, 122); c.lineTo(kx + 21, 106); c.stroke();
    c.fillStyle = "#FF8A3C"; c.fillRect(kx - 11, 116, 22, 26);
    c.fillStyle = "#2E4057"; c.fillRect(kx - 9, 142, 7, 10); c.fillRect(kx + 2, 142, 7, 10);
    c.fillStyle = "#F2C9A0"; c.beginPath(); c.arc(kx, 106, 9, 0, 7); c.fill();
    /* ball */
    c.font = "22px sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText("⚽", soccer.ball.x, soccer.ball.y);
    /* message */
    if (soccer.msg) {
      c.font = "800 28px sans-serif";
      c.lineWidth = 5; c.strokeStyle = "#22304A"; c.fillStyle = "#FFFFFF";
      c.strokeText(soccer.msg, SOC.W / 2, 186);
      c.fillText(soccer.msg, SOC.W / 2, 186);
    }
  }
  function soccerShoot(zone) {
    if (!soccer.playing || soccer.phase !== "aim") return;
    soccer.phase = "flight";
    soccer.shot++;
    sfx.thump();
    /* the goalie remembers your favourite corner */
    var kz = (soccer.lastZone >= 0 && Math.random() < 0.45) ? soccer.lastZone : ri(0, 2);
    soccer.lastZone = zone;
    var t0 = performance.now(), dur = 380;
    var bx0 = soccer.ball.x, by0 = soccer.ball.y;
    var tx = SOC.zonesX[zone], ty = SOC.goalY;
    var kx0 = soccer.keeperX, ktx = SOC.zonesX[kz];
    function fly(now) {
      if (!soccer.playing) return;
      var t = Math.min(1, (now - t0) / dur);
      var e = 1 - (1 - t) * (1 - t);
      soccer.ball = { x: bx0 + (tx - bx0) * e, y: by0 + (ty - by0) * e };
      soccer.keeperX = kx0 + (ktx - kx0) * Math.min(1, t * 1.2);
      soccerDraw();
      if (t < 1) { soccer.raf = requestAnimationFrame(fly); return; }
      var goal = kz !== zone;
      if (goal) { soccer.goals++; sfx.cheer(); soccer.msg = "GOAL! 🎉"; }
      else { sfx[pick(["splat", "honk", "boing"])](); soccer.msg = "Saved! 🧤"; }
      soccer.phase = "result";
      soccerStat();
      soccerDraw();
      soccer.wait = setTimeout(function () {
        soccer.msg = "";
        if (soccer.shot >= 5) { endSoccer(); return; }
        soccer.ball = { x: SOC.ballX, y: SOC.ballY };
        soccer.keeperX = SOC.keeperHome;
        soccer.phase = "aim";
        soccerStat();
        soccerDraw();
      }, 1000);
    }
    soccer.raf = requestAnimationFrame(fly);
  }
  function stopSoccer() {
    if (soccer.raf) cancelAnimationFrame(soccer.raf);
    clearTimeout(soccer.wait);
    if (soccer.playing) {
      soccer.playing = false;
      soccer.wasBest = recordSoccerBest();
    }
  }
  function endSoccer() {
    stopSoccer();
    var g = soccer.goals;
    if (g >= 4) { sfx.bigwin(); confetti(); }
    else if (g >= 2) sfx.fanfare();
    else sfx.trombone();
    $("soccerOverHead").textContent = g === 5 ? "⚽ PERFECT — 5 of 5!" : "⚽ " + g + " of 5!";
    $("soccerOverSub").textContent =
      (soccer.wasBest ? "🏆 New best! " : "Best: ⚽ " + (state.best.soccer === null ? 0 : state.best.soccer) + "/5. ") +
      (g === 0 ? "That goalie is a wall! " : "") + questReminder();
    $("soccerOver").classList.add("show");
  }
  document.querySelectorAll(".aimRow [data-aim]").forEach(function (b) {
    b.addEventListener("click", function () { soccerShoot(+b.dataset.aim); });
  });
  (function () {
    var cv = $("soccerCanvas"), sx = null;
    cv.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; e.preventDefault(); }, { passive: false });
    cv.addEventListener("touchend", function (e) {
      if (sx === null) return;
      var dx = e.changedTouches[0].clientX - sx;
      sx = null;
      soccerShoot(dx < -24 ? 0 : dx > 24 ? 2 : 1);
    });
    cv.addEventListener("click", function (e) {
      var r = cv.getBoundingClientRect(), x = e.clientX - r.left;
      soccerShoot(x < r.width / 3 ? 0 : x > (2 * r.width) / 3 ? 2 : 1);
    });
  })();
  document.addEventListener("keydown", function (e) {
    if (!$("soccerOverlay").classList.contains("open")) return;
    var z = { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2 }[e.key];
    if (z !== undefined) { e.preventDefault(); soccerShoot(z); }
  });

  /* keyboard for quest */
  document.addEventListener("keydown", function (e) {
    if (lessonOpen()) {
      if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); $("lessonNext").click(); }
      if (e.key === "ArrowLeft") { e.preventDefault(); $("lessonPrev").click(); }
      return;
    }
    if (document.querySelector(".overlay.open")) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4) {
      var b = $("answers").children[n - 1];
      if (b && !b.disabled) b.click();
    }
  });

  /* debug hook for automated checks */
  window.__MQ = {
    state: state,
    snake: snake,
    soccer: soccer,
    tier: tier,
    gen: function (t, lv) { return GENS[t](lv || 2); },
    simp: simp
  };

  loadQuestion();
})();
</script>
</body>
</html>
